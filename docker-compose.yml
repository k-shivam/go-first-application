#docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

api:
    build:
      context: .
      dockerfile: Dockerfile
      container_name: task_manager_api
      environment:
        PORT: 8080
        ENV: production
        DB_HOST: postgres
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: 
        DB_NAME: taskmanager
        DB_SSLMODE: disableJWT_SECRET: super-secure-production-jwt-secret-key-32chars
        JWT_EXPIRY_HOURS: 24
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
  
  volume:
    postgres_data: